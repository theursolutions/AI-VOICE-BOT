<style>
:root{
  --navy:#1b3962; --blue:#2f6fb5; --ink:#0b1b33; --accent:#1d4ed8; --dim:#46587a;

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050609;transform-origin:center center;flex:none}
.abs{position:absolute}
.scene{position:absolute;inset:0;opacity:0}
.ur .t{font-family:'Noto Nastaliq Urdu',Inter,serif;line-height:1.9;letter-spacing:0!important}
.latin{font-family:Inter,system-ui,sans-serif!important;line-height:1.35!important;direction:ltr}
.mono{font-family:'JetBrains Mono',monospace}
svg{display:block}

/* ---------- night scenes ---------- */
#night{background:radial-gradient(1200px 800px at 70% 40%,#0f1a2e 0%,#070a12 55%,#030408 100%)}
#lamp{position:absolute;width:900px;height:900px;left:-200px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,90,.16),rgba(255,176,90,0) 65%)}
.h-night{position:absolute;inset-inline-start:140px;width:820px;color:#f3f6fb;font-weight:800;font-size:84px;line-height:1.06;letter-spacing:-.03em}
.ur .h-night{font-size:70px;font-weight:700;line-height:1.9}
#phone{position:absolute;left:1210px;top:120px;width:420px;height:850px;border-radius:64px;background:#0b0f18;border:2px solid #263244;box-shadow:0 60px 140px rgba(0,0,0,.7),inset 0 0 0 10px #05070c}
#screen{position:absolute;inset:12px;border-radius:54px;overflow:hidden;background:linear-gradient(170deg,#18243c 0%,#0c1222 60%,#080b14 100%)}
#notch{position:absolute;top:18px;left:50%;width:120px;height:32px;margin-left:-60px;border-radius:20px;background:#000}
#clock{position:absolute;top:80px;width:100%;text-align:center;color:#e8eefb;font-size:104px;font-weight:300;letter-spacing:-.03em}
#cdate{position:absolute;top:200px;width:100%;text-align:center;color:#9fb0cc;font-size:22px;font-weight:500}
.notif{position:absolute;left:18px;width:360px;border-radius:24px;padding:14px 16px;background:rgba(255,255,255,.13);backdrop-filter:blur(14px);display:flex;gap:12px;align-items:flex-start;color:#fff;direction:ltr}
.notif .ic{flex:none;width:40px;height:40px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center}

.notif .msg{font-size:17px;color:#e6ecf7;margin-top:1px}
#badge{position:absolute;right:-14px;top:-14px;min-width:64px;height:64px;padding:0 14px;border-radius:32px;background:#ef4444;color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(239,68,68,.5);opacity:0}
.bub{position:absolute;display:flex;gap:10px;align-items:center;padding:14px 20px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#eef2fa;font-size:24px;font-weight:600;white-space:nowrap;direction:ltr}
.bub .ic{width:30px;height:30px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
.bub.meta{background:none;border:none;color:#7f8ca3;font-size:20px;font-weight:500}
#lost{position:absolute;left:1030px;top:470px;width:560px;direction:ltr}
#lost .lcard{padding:22px 26px;border-radius:26px;background:rgba(255,255,255,.12);color:#fff;font-size:30px;font-weight:600;display:flex;gap:14px;align-items:center}
#lost .sub{margin-top:14px;color:#8a97ad;font-size:20px;font-weight:500;padding-left:8px}

/* ---------- brand reveal ---------- */
#reveal{background:#030408}
#bloom{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#2f6fb5 0%,#1b3962 45%,#0b1b33 100%);transform:translate(-50%,-50%)}
#logoRow{position:absolute;left:0;right:0;top:390px;display:flex;align-items:center;justify-content:center;gap:34px;direction:ltr}
#logoRow img{width:130px;height:auto}
#wordmark{color:#fff;font-weight:800;font-size:124px;letter-spacing:-.045em}
#wordmark b{color:#8cc4ff;font-weight:800}
#turnLine{position:absolute;left:0;right:0;top:640px;text-align:center;color:#d9e6fb;font-size:54px;font-weight:600;letter-spacing:-.02em}
.ur #turnLine{font-size:50px}
#wipe{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bg);transform:translate(-50%,-50%)}

/* ---------- light scenes ---------- */
#light{background:var(--bg)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(27,57,98,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(27,57,98,.05) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(1400px 900px at 50% 40%,#000 30%,transparent 80%)}
.eyebrow{color:var(--blue);font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ur .eyebrow{letter-spacing:0;text-transform:none;font-size:26px}
.h-light{color:var(--ink);font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-.035em}
.ur .h-light{font-size:76px;font-weight:700;line-height:1.8}
.h-light em{font-style:normal;color:var(--accent)}
.checks{margin-top:40px;display:flex;flex-direction:column;gap:22px}
.chk{display:flex;align-items:center;gap:18px;color:#1f3350;font-size:32px;font-weight:600}
.ur .chk{font-size:32px}
.chk .dot{flex:none;width:44px;height:44px;border-radius:50%;background:#dbe8fb;display:flex;align-items:center;justify-content:center}
.demoNote{position:absolute;bottom:34px;inset-inline-start:140px;color:#8a99b3;font-size:17px;font-weight:500}
.ur .demoNote{font-size:19px}

#s5text{position:absolute;inset-inline-start:140px;top:250px;width:820px}
#widget{direction:ltr;position:absolute;inset-inline-end:170px;top:110px;width:540px;height:860px;border-radius:28px;background:#fff;box-shadow:0 50px 120px rgba(27,57,98,.22),0 0 0 1px rgba(27,57,98,.06);overflow:hidden}
#wHead{height:110px;background:linear-gradient(135deg,#1b3962,#2f6fb5);display:flex;align-items:center;gap:16px;padding:0 26px;color:#fff}
#wHead .av{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--navy);font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;font-family:Inter}
#wHead .nm{font-size:23px;font-weight:700;font-family:Inter}
#wHead .st{font-size:16px;color:#cfe0f7;display:flex;align-items:center;gap:8px;font-family:Inter}
#wHead .st i{width:9px;height:9px;border-radius:50%;background:#4ade80;display:block}
#wHead .lang{margin-inline-start:auto;padding:6px 14px;border-radius:14px;background:rgba(255,255,255,.18);font-size:17px;font-weight:600}
#wBody{position:absolute;top:110px;left:0;right:0;bottom:104px;overflow:hidden;background:#f6f9fc}
#wMsgs{position:absolute;left:0;right:0;top:0;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.m{max-width:410px;padding:15px 19px;border-radius:20px;font-size:21px;line-height:1.4;font-weight:500}
.ur .m.t{font-size:21px;line-height:2}
.m.c{align-self:flex-end;background:var(--navy);color:#fff;border-end-end-radius:6px}
.m.a{align-self:flex-start;background:#fff;color:#1c2b44;border:1px solid #e3eaf4;border-end-start-radius:6px;box-shadow:0 2px 6px rgba(27,57,98,.05)}
.m.sys{align-self:center;max-width:none;background:#e8f7ee;color:#166534;border-radius:999px;font-size:17px;font-weight:600;padding:9px 18px}
.typing{position:absolute;inset-inline-start:22px;padding:18px 20px;border-radius:20px;background:#fff;border:1px solid #e3eaf4;display:flex;gap:7px}
.typing i{width:10px;height:10px;border-radius:50%;background:#8ea3c2;display:block}
#wFoot{position:absolute;left:0;right:0;bottom:0;height:104px;border-top:1px solid #e6edf6;background:#fff;padding:16px 22px 0}
#wFoot .in{height:50px;border-radius:25px;background:#f1f5fa;color:#94a3b8;font-size:18px;display:flex;align-items:center;padding:0 22px;font-family:Inter;direction:ltr}
#wFoot .pw{margin-top:9px;text-align:center;color:#9aa8bd;font-size:13px;font-family:Inter;direction:ltr}

#s6{}
#s6head{position:absolute;left:0;right:0;top:120px;text-align:center}
#tiles{position:absolute;left:0;right:0;top:400px;display:flex;justify-content:center;gap:34px;direction:ltr}
.tile{width:220px;height:210px;border-radius:28px;background:#fff;box-shadow:0 24px 60px rgba(27,57,98,.12),0 0 0 1px rgba(27,57,98,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#1f3350;font-size:24px;font-weight:700}
.ur .tile span{font-family:'Noto Nastaliq Urdu';font-size:24px;line-height:1.6}
.tile .ib{width:78px;height:78px;border-radius:22px;background:#f1f6fd;display:flex;align-items:center;justify-content:center;color:var(--blue)}
#hubLines{position:absolute;left:0;top:0}
#hub{position:absolute;left:50%;top:770px;width:124px;height:124px;margin-left:-62px;border-radius:34px;background:#fff;box-shadow:0 24px 60px rgba(27,57,98,.2);display:flex;align-items:center;justify-content:center}
#hub img{width:78px}
#lead{position:absolute;inset-inline-end:110px;top:700px;width:480px;padding:22px 26px;border-radius:24px;background:#fff;box-shadow:0 30px 80px rgba(27,57,98,.2);direction:ltr;font-family:Inter}
#lead .lt{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700;font-size:18px}
#lead .lt i{width:10px;height:10px;border-radius:50%;background:var(--ok);display:block}
#lead .ln{margin-top:10px;font-size:26px;font-weight:800;color:var(--ink)}
#lead .lm{margin-top:6px;font-size:18px;color:var(--dim);line-height:1.5}

#s7text{position:absolute;inset-inline-start:130px;top:330px;width:580px}
#s7text .h-light{font-size:78px}
.ur #s7text .h-light{font-size:66px}
#inbox{position:absolute;inset-inline-end:110px;top:150px;width:1080px;height:780px;border-radius:26px;background:#fff;box-shadow:0 50px 120px rgba(27,57,98,.2),0 0 0 1px rgba(27,57,98,.06);overflow:hidden;direction:ltr;font-family:Inter;display:flex}
#ibList{width:390px;border-right:1px solid #e6edf6;background:#fbfcfe}
#ibList .top{height:78px;display:flex;align-items:center;padding:0 24px;font-size:22px;font-weight:800;color:var(--ink);border-bottom:1px solid #e6edf6}
.row{height:112px;padding:18px 22px;border-bottom:1px solid #eef2f8;display:flex;gap:14px;position:relative}
.row .ci{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #e2e8f0;display:flex;align-items:center;justify-content:center;flex:none}
.row .rn{font-size:19px;font-weight:700;color:var(--ink)}
.row .rp{font-size:16px;color:#64748b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:280px}
.tag{display:inline-block;margin-top:7px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:10px}
.tag.h{background:#fde7ef;color:var(--hot)}
.tag.r{background:#e8f7ee;color:#15803d}
.tag.w{background:#e7effb;color:var(--blue)}
.row.sel{background:#eef4fd}
.row.sel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
#ibThread{flex:1;position:relative;background:#f6f9fc}
#ibThread .top{height:78px;background:#fff;border-bottom:1px solid #e6edf6;display:flex;align-items:center;padding:0 26px;gap:14px}
#ibThread .top .n{font-size:21px;font-weight:800;color:var(--ink)}
#ibThread .top .s{font-size:15px;color:#64748b}
#claim{margin-left:auto;padding:12px 24px;border-radius:14px;background:var(--navy);color:#fff;font-size:17px;font-weight:700}
#aiState{padding:8px 14px;border-radius:12px;font-size:14px;font-weight:700;background:#e7effb;color:var(--blue)}
#ibMsgs{position:absolute;top:100px;left:26px;right:26px;display:flex;flex-direction:column;gap:14px}
#ibMsgs .m{font-size:19px;max-width:520px}
#ibMsgs .m.c{align-self:flex-start;background:#fff;color:#1c2b44;border:1px solid #e3eaf4;border-radius:20px;border-end-start-radius:6px}
#ibMsgs .m.a{align-self:flex-end;background:#e7effb;color:#1c2b44;border:none;border-radius:20px;border-end-end-radius:6px}
#ibMsgs .m.h{align-self:flex-end;background:var(--navy);color:#fff;border-radius:20px;border-end-end-radius:6px}
#ibMsgs .who{font-size:13px;font-weight:700;color:#7a8aa3;margin-bottom:-8px}
#ibMsgs .who.r{align-self:flex-end}
#ibCompose{position:absolute;left:26px;right:26px;bottom:24px;height:64px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #dfe7f2;display:flex;align-items:center;padding:0 20px;font-size:18px;color:#1c2b44}
#caret{display:inline-block;width:2px;height:24px;background:var(--blue);margin-left:2px;vertical-align:middle}
#cursor{position:absolute;width:34px;height:34px;left:0;top:0;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

#s8text{position:absolute;inset-inline-start:140px;top:110px;width:1640px;display:flex;align-items:flex-end;gap:36px}
#dash{position:absolute;left:140px;right:140px;top:300px;height:600px;direction:ltr;font-family:Inter}
.kpis{display:flex;gap:26px}
.kpi{flex:1;height:170px;border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(27,57,98,.1),0 0 0 1px rgba(27,57,98,.05);padding:26px 28px}
.kpi .kl{font-size:17px;color:#64748b;font-weight:600}
.kpi .kv{margin-top:12px;font-size:56px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
.kpi .ks{font-size:15px;color:#94a3b8;margin-top:2px}
.cards{display:flex;gap:26px;margin-top:26px}
.card{border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(27,57,98,.1),0 0 0 1px rgba(27,57,98,.05);padding:24px 28px;height:400px}
.card .ct{font-size:19px;font-weight:700;color:var(--ink)}
.bars{margin-top:26px;display:flex;flex-direction:column;gap:22px}
.bar .bl{display:flex;justify-content:space-between;font-size:17px;color:#334155;font-weight:600}
.bar .bt{margin-top:8px;height:12px;border-radius:6px;background:#eef2f8;overflow:hidden}
.bar .bf{height:100%;border-radius:6px;background:linear-gradient(90deg,#1b3962,#2f6fb5)}
.lock{display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(27,57,98,.08);color:var(--navy);font-size:22px;font-weight:700;margin-bottom:22px;white-space:nowrap}
.ur .lock span{font-family:'Noto Nastaliq Urdu';font-size:22px;line-height:1.7}

#cta{background:var(--bg)}
#ctaIn{position:absolute;left:0;right:0;top:190px;display:flex;flex-direction:column;align-items:center;text-align:center}
#ctaIn img{width:120px}
#cta1{margin-top:46px;color:var(--ink);font-size:84px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
#cta2{color:var(--accent);font-size:84px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.ur #cta1,.ur #cta2{font-size:70px;font-weight:700;line-height:1.75}
#btn{margin-top:56px;position:relative;overflow:hidden;padding:26px 56px;border-radius:999px;background:var(--navy);color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;gap:16px;box-shadow:0 24px 60px rgba(27,57,98,.35)}
.ur #btn{font-size:32px;padding:16px 56px}
#shine{position:absolute;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
#btnSub{margin-top:26px;color:var(--dim);font-size:24px}
.ur #btnSub{font-size:26px}
#url{margin-top:30px;color:var(--navy);font-size:30px;font-weight:700;letter-spacing:.01em;direction:ltr}

.ur #phone{left:290px}
.ur #widget{right:auto;left:170px}
.ur #inbox{right:auto;left:110px}
.ur #lost{left:330px}
.ur .h-night{width:900px}
.lat{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1}
.ur .chk .lat,.ur .eyebrow .lat,.ur #btnSub .lat{font-weight:600}
#logoTile{width:190px;height:190px;border-radius:48px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1400px 900px at 50% 50%,transparent 60%,rgba(0,0,0,.28) 100%)}
#black{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
#hud{position:fixed;left:12px;bottom:10px;color:#9aa;font:12px Inter;z-index:9}
</style>
</head>
<body>
<div id="stage">
  <div id="night" class="scene">
    <div id="lamp"></div>
    <div id="bubbles"></div>
    <div id="phone"><div id="screen"><div id="notch"></div><div id="clock">11:47</div><div id="cdate"></div><div id="notifs"></div></div><div id="badge">3</div></div>
    <div id="lost"><div class="lcard"><span class="ic" id="lostIc"></span><span id="lostTx"></span></div><div class="sub" id="lostSub"></div></div>
    <div id="hHook" class="h-night t"></div>
    <div id="hPain" class="h-night t"></div>
    <div id="hCost1" class="h-night t"></div>
    <div id="hCost2" class="h-night t"></div>
  </div>

  <div id="reveal" class="scene">
    <div id="bloom"></div>
    <div id="logoRow"><div id="logoTile"><img id="logo1" alt=""></div><div id="wordmark">serve<b>AI</b></div></div>
    <div id="turnLine" class="t"></div>
    <div id="wipe"></div>
  </div>

  <div id="light" class="scene">
    <div id="grid"></div>
    <div id="s5" class="scene">
      <div id="s5text"><div class="eyebrow t" id="eyebrow"></div><div class="h-light t" id="s5h" style="margin-top:18px"></div><div class="checks" id="checks"></div></div>
      <div id="widget">
        <div id="wHead"><div class="av">Z</div><div><div class="nm">Zeenat Assistant</div><div class="st"><i></i>Online</div></div><div class="lang t" id="wLang"></div></div>
        <div id="wBody"><div id="wMsgs"></div><div class="typing" id="typing"><i></i><i></i><i></i></div></div>
        <div id="wFoot"><div class="in">Type your message...</div><div class="pw">Powered by serveAI</div></div>
      </div>
    </div>
    <div id="s6" class="scene">
      <svg id="hubLines" width="1920" height="1080"></svg>
      <div id="s6head"><div class="h-light t" id="s6h1"></div><div class="h-light t" id="s6h2"><em></em></div></div>
      <div id="tiles"></div>
      <div id="hub"><img id="logo2" alt=""></div>
      <div id="lead"><div class="lt"><i></i>New lead captured</div><div class="ln">Hina · Wedding order</div><div class="lm">40 outfits · +92 3•• •••• 218<br>via Web chat · just now</div></div>
    </div>
    <div id="s7" class="scene">
      <div id="s7text"><div class="h-light t" id="s7h1"></div><div class="h-light t" id="s7h2"><em></em></div></div>
      <div id="inbox">
        <div id="ibList"><div class="top">Messages</div><div id="rows"></div></div>
        <div id="ibThread">
          <div class="top"><div><div class="n">Hina</div><div class="s">Web chat · waiting 12s</div></div><div id="aiState" style="margin-left:18px">AI active</div><div id="claim">Claim</div></div>
          <div id="ibMsgs"></div>
          <div id="ibCompose"><span id="typed"></span><span id="caret"></span></div>
        </div>
        <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#0b1b33" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="s8" class="scene">

function measure(){
  viewH = $('wBody').clientHeight;
  T.chat.forEach((_,i)=>{ const e=$('cm'+i); chatTops[i]=e.offsetTop; chatBottoms[i]=e.offsetTop+e.offsetHeight; });
  measured=true;
}

function render(t){
  if(!measured) measure();
  // ===== NIGHT (0 – 15) =====
  const night = $('night');
  night.style.opacity = t<15.2 ? 1 : 0;
  if (t < 15.2){
    // phone
    let buzz = 0; NT.forEach(n=>{ if(t>n){ const d=t-n; buzz += Math.sin(d*90)*Math.exp(-d*14); } });
    const drift = 1 + 0.03*P(t,0,5);
    const phoneOut = eio(P(t,4.8,6.2));
    const phoneFade = 1 - P(t,10.8,12.0)*0.85;
    $('phone').style.transform = `translateX(${lerp(0,LANG==='ur'?-90:90,phoneOut)}px) scale(${drift*lerp(1,.86,phoneOut)}) rotate(${buzz*1.4}deg)`;
    $('phone').style.opacity = phoneFade * (1-P(t,14.2,14.7));
    $('phone').style.filter = `blur(${P(t,10.8,12)*6}px)`;
    // notifications stack (newest on top)
    NT.forEach((n,i)=>{
      const e=$('nf'+i); const a=eo(P(t,n,n+.4));
      let slot=0; NT.forEach((m,j)=>{ if(j>i) slot+=eo(P(t,m,m+.4)); });
      e.style.top = (262 + slot*104) + 'px';
      S(e, a*(1-cl(slot-4.2)), `translateY(${(1-a)*-30}px) scale(${lerp(.94,1,a)})`);
    });
    // badge
    const bA = eo(P(t,5.4,5.8));
    let count = 3 + Math.floor(cl((t-5.4)/5.4)*24);
    $('badge').textContent = count; S($('badge'), bA, `scale(${lerp(.4,1,back(P(t,5.4,5.9)))})`);
    // bubbles
    BT.forEach((b,i)=>{ const e=$('bb'+i); const a=back(P(t,b,b+.45)); const o=eo(P(t,b,b+.3))*(1-P(t,10.6,11.6)*0.85)*(1-P(t,14.1,14.6));
      const fl=Math.sin(t*1.3+i)*6; S(e,o,`translateY(${fl}px) scale(${lerp(.6,1,cl(a,0,1.2))})`); e.style.filter=`blur(${P(t,10.6,11.6)*5}px)`; });
    // lost
    const la = eo(P(t,11.1,11.6)); const lg = P(t,12.6,13.4);
    S($('lost'), la*(1-lg*.55)*(1-P(t,14.1,14.6)), `translateY(${(1-la)*24}px)`);
    $('lostSub').style.opacity = eo(P(t,12.4,12.9));
    // headlines
    S($('hHook'), win(t,0.6,4.9,.6,.4), `translateY(${(1-eo(P(t,.6,1.3)))*26}px)`); $('hHook').style.top='380px';
    $('hPain').style.top='330px'; $('hPain').style.opacity = win(t,5.1,10.9,.1,.5);
    [5.2,7.0,8.8].forEach((s,i)=>{ const e=$('pl'+i); const a=eo(P(t,s,s+.45)); const dimmed = i<2 ? 1-P(t,[7.0,8.8][i],[7.0,8.8][i]+.4)*.6 : 1;
      S(e, a*dimmed, `translateY(${(1-a)*22}px)`); });
    $('hCost1').style.top='330px'; S($('hCost1'), win(t,11.3,14.6,.6,.35)*(1-P(t,13.1,13.5)*.55), `translateY(${(1-eo(P(t,11.3,12)))*24}px)`);
    $('hCost2').style.top = LANG==='ur' ? '640px':'600px'; $('hCost2').style.color='#8fb2e6';
    S($('hCost2'), win(t,13.2,14.6,.5,.35), `translateY(${(1-eo(P(t,13.2,13.8)))*20}px)`);
    $('lamp').style.opacity = 1 - P(t,11,14);
  }
  // ===== REVEAL (15 – 19.3) =====
  const rv = $('reveal'); rv.style.opacity = (t>=14.8 && t<19.6) ? 1 : 0;
  if (t>=14.8 && t<19.6){
    const b = eo5(P(t,15.35,17.2)); const sz = lerp(0, 3200, b);
    $('bloom').style.width = $('bloom').style.height = sz+'px';
    $('bloom').style.opacity = cl(P(t,15.35,15.8));
    const la = eo(P(t,15.7,16.4));
    S($('logoRow'), la, `scale(${lerp(.92,1,la)})`);
    const tl = eo(P(t,16.6,17.2)); S($('turnLine'), tl, `translateY(${(1-tl)*18}px)`);
    const w = eio(P(t,18.5,19.35)); const ws = lerp(0, 2600, w);
    $('wipe').style.width = $('wipe').style.height = ws+'px';
  }
  // ===== LIGHT (19 – 43) =====
  const lt = $('light'); lt.style.opacity = (t>=19.3 && t<43.4) ? 1 : 0;
  if (t>=19.3 && t<43.4){
    $('demoNote').style.opacity = win(t,19.6,42.6,.6,.4)*0.9;
    // --- S5 19.3–29.2
    const s5 = $('s5'); const s5o = win(t,19.3,29.3,.3,.5); s5.style.opacity = s5o;
    s5.style.transform = `translateY(${-P(t,28.8,29.3)*40}px)`;
    if (s5o>0){
      const ea = eo(P(t,19.4,20.0)); S($('s5text'), ea, `translateY(${(1-ea)*30}px)`);
      [20.9, 23.9, 26.9].forEach((c,i)=>{ const a=eo(P(t,c,c+.45)); S($('ck'+i), a, `translateY(${(1-a)*16}px)`); });
      const wa = eo(P(t,19.45,20.1)); S($('widget'), wa, `translateY(${(1-wa)*60}px) scale(${lerp(.97,1,wa)})`);
      // messages
      let shiftBottom = 0;
      T.chat.forEach((_,i)=>{ const a=eo(P(t,CT[i],CT[i]+.35)); const e=$('cm'+i);
        S(e, a, `translateY(${(1-a)*14}px) scale(${lerp(.96,1,a)})`);
        if (a>0){ const prev = i? chatBottoms[i-1]:0; shiftBottom = lerp(prev, chatBottoms[i], a); }
      });
      // typing indicator
      let ty=0, tyTop=0;
      TYP.forEach((w,k)=>{ const v = (t>=w[0] && t<w[1]) ? eo(P(t,w[0],w[0]+.15)) : 0; if(v>0){ ty=v; tyTop=chatTops[k*2+1]; shiftBottom=Math.max(shiftBottom, lerp(chatBottoms[k*2], chatTops[k*2+1]+58, v)); } });
      const typ=$('typing'); typ.style.top = tyTop + 'px'; typ.style.opacity = ty;
      typ.querySelectorAll('i').forEach((d,j)=>{ d.style.transform=`translateY(${Math.sin(t*14 - j*.9)*-4}px)`; });
      const sh = Math.max(0, shiftBottom + 40 - viewH);
      $('wMsgs').style.transform = `translateY(${-sh}px)`; typ.style.transform=`translateY(${-sh}px)`;
    }
    // --- S6 29.2–35.2
    const s6 = $('s6'); const s6o = win(t,29.1,35.3,.35,.45); s6.style.opacity = s6o;
    if (s6o>0){
      const h1 = eo(P(t,29.3,29.9)); S($('s6h1'), h1, `translateY(${(1-h1)*24}px)`);
      const h2 = eo(P(t,32.4,33.0)); S($('s6h2'), h2, `translateY(${(1-h2)*24}px)`);
      $('s6head').style.transform = `translateY(${-P(t,32.3,33)*0}px)`;
      const hubA = eo(P(t,30.9,31.4));
      let lines='';
      TK.forEach((_,i)=>{ const s=29.7+i*.22; const a=back(P(t,s,s+.5)); S($('tl'+i), cl(eo(P(t,s,s+.3))), `translateY(${(1-cl(a))*40}px) scale(${lerp(.8,1,cl(a,0,1.1))})`);
        const x1 = 1920/2 + (i-2.5)*254, y1=610, x2=960, y2=770; const d = eo(P(t,31.0+i*.08,31.7+i*.08));
        const xe = lerp(x1,x2,d), ye=lerp(y1,y2,d);
        const pulse = (t>31.8) ? ((t*0.9+i*.17)%1) : -1;
        lines += `<line x1="${x1}" y1="${y1}" x2="${xe}" y2="${ye}" stroke="#2f6fb5" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>`;
        if (pulse>=0) lines += `<circle cx="${lerp(x1,x2,pulse)}" cy="${lerp(y1,y2,pulse)}" r="6" fill="#1d4ed8" opacity="${Math.sin(pulse*Math.PI)}"/>`;
      });
      $('hubLines').innerHTML = lines;
      S($('hub'), hubA, `scale(${lerp(.6,1,back(P(t,30.9,31.5)))})`);
      const ld = eo(P(t,32.6,33.2)); S($('lead'), ld, `translateY(${(1-ld)*40}px)`);
      $('tiles').style.transform = `translateY(${-eio(P(t,32.3,33))*0}px)`;
    }
    // --- S7 35.2–39.7
    const s7=$('s7'); const s7o = win(t,35.1,39.8,.35,.45); s7.style.opacity=s7o;
    if (s7o>0){
      const a1=eo(P(t,35.3,35.9)); S($('s7h1'),a1,`translateY(${(1-a1)*24}px)`);
      const a2=eo(P(t,37.0,37.6)); S($('s7h2'),a2,`translateY(${(1-a2)*24}px)`);
      const ib=eo(P(t,35.2,35.8)); S($('inbox'), ib, `translateY(${(1-ib)*50}px)`);
      // other rows flip to resolved
      $('tg4').textContent = t>37.2 ? 'AI resolved' : T.rows[4][4]; $('tg4').className = 'tag ' + (t>37.2?'r':'w');
      // cursor path to Claim
      const cp = eio(P(t,35.9,36.6)); const cx = lerp(900, 985, cp), cy = lerp(600, 36, cp);
      const click = P(t,36.6,36.75); const cur=$('cursor');
      cur.style.left = cx+'px'; cur.style.top = cy+'px'; cur.style.opacity = win(t,35.8,37.4,.2,.3);
      cur.style.transform = `scale(${1 - Math.sin(click*Math.PI)*.18})`;
      const claimed = t>36.72;
      $('claim').style.transform = `scale(${1 - Math.sin(click*Math.PI)*.06})`;
      $('claim').textContent = claimed ? 'Claimed' : 'Claim'; $('claim').style.background = claimed ? '#16a34a' : 'var(--navy)';
      $('aiState').textContent = claimed ? 'AI paused' : 'AI active';
      $('aiState').style.background = claimed ? '#fde7ef' : '#e7effb'; $('aiState').style.color = claimed ? 'var(--hot)' : 'var(--blue)';
      $('tg0').textContent = claimed ? 'Ahmed · claimed' : 'Needs a human'; $('tg0').className = 'tag ' + (claimed?'w':'h');
      $('ibSys').style.opacity = eo(P(t,36.8,37.1));
      const full = T.ahmed; const n = Math.floor(full.length * cl((t-37.2)/1.25));
      const sent = t>38.65;
      $('typed').textContent = sent ? '' : full.slice(0,n);
      $('caret').style.opacity = sent ? 0 : ((Math.floor(t*2.2)%2)?1:.2);
      const sa = eo(P(t,38.65,38.95)); $('ibWho').style.opacity=sa; S($('ibH'), sa, `translateY(${(1-sa)*12}px)`);
    }
    // --- S8 39.7–43.2
    const s8=$('s8'); const s8o = win(t,39.6,43.3,.35,.4); s8.style.opacity=s8o;
    if (s8o>0){
      const a=eo(P(t,39.8,40.4)); S($('s8text'),a,`translateY(${(1-a)*24}px)`);
      const d=eo(P(t,39.8,40.5)); $('dash').style.opacity=d; $('dash').style.transform=`translateY(${(1-d)*40 - P(t,39.8,43.3)*14}px)`;
      KP.forEach((k,i)=>{ const v = eo(P(t,40.1+i*.12,41.5+i*.12))*k[1]; $('kv'+i).textContent = k[1]%1 ? v.toFixed(1)+'%' : Math.round(v).toLocaleString('en-US'); });
      $('clpR').setAttribute('width', eio(P(t,40.3,41.9))*900);
      BR.forEach((b,i)=>{ $('bf'+i).style.width = (eo(P(t,40.4+i*.1,41.5+i*.1))*b[1]/42*100)+'%'; });
    }
  }
  // ===== CTA (43 – 47) =====
  const cta=$('cta'); const co = eo(P(t,43.0,43.5)); cta.style.opacity = t>=43 ? co : 0;
  if (t>=43){
    const l=eo(P(t,43.1,43.6)); S($('logo3'), l, `scale(${lerp(.85,1,l)})`);
    const c1=eo(P(t,43.3,43.8)); S($('cta1'), c1, `translateY(${(1-c1)*22}px)`);
    const c2=eo(P(t,43.6,44.1)); S($('cta2'), c2, `translateY(${(1-c2)*22}px)`);
    const bt=back(P(t,43.95,44.5)); S($('btn'), cl(eo(P(t,43.95,44.3))), `scale(${lerp(.85,1,cl(bt,0,1.1))})`);
    $('shine').style.left = lerp(-160, 520, eio(P(t,44.6,45.4)))+'px';
    const sb=eo(P(t,44.25,44.7)); $('btnSub').style.opacity=sb; $('url').style.opacity=eo(P(t,44.45,44.9));
  }
  // global fade to black at the very start / end
  $('black').style.opacity = 1 - eo(P(t,0,.35));
  $('vign').style.opacity = t<19.3 ? 1 : .35;
  if(!RENDER) $('hud').textContent = t.toFixed(2)+'s · '+LANG.toUpperCase()+' · click to pause · ?lang=ur';
}

window.renderAt = t => render(t);
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`scale(${s})`; }
if (!RENDER){ addEventListener('resize',fit); fit(); }
window.ready = document.fonts.ready.then(()=>new Promise(r=>{ const im=$('logo1'); if(im.complete) r(); else im.onload=r; })).then(()=>{ measure(); render(0); });
if (!RENDER){
  let t0=null, paused=false, pt=0;
  document.body.addEventListener('click',()=>{ paused=!paused; if(!paused) t0=null; });
  window.ready.then(()=>{ const loop=ts=>{ if(!paused){ if(t0===null) t0=ts-pt*1000; pt=((ts-t0)/1000)%DUR; render(pt);} requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
</body>
</html>
