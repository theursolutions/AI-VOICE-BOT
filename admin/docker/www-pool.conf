[www]
; Keep the container environment available to PHP-FPM workers so Laravel's
; env()/getenv() can read the values injected by docker-compose.
clear_env = no

; Surface worker stdout/stderr into the FPM (and therefore container) log.
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; ── Hard stop for a worker that will never come back ────────────────────────
; php.ini sets max_execution_time = 300, but PHP does NOT count time a worker
; spends blocked in an external syscall — waiting on MySQL, for instance. So a
; request stuck on a slow query is immortal as far as PHP is concerned.
;
; 2026-09-09: twenty copies of the super-admin "top pages" GROUP BY sat in
; MySQL for 16.5 hours each. max_execution_time never fired, all twenty
; children above stayed pinned, `/` stopped answering, both app replicas failed
; their healthcheck, HAProxy ejected them and the site served 503 with no
; backends left. request_terminate_timeout is the only limit that would have
; capped it, and it was not set.
;
; It sits just ABOVE max_execution_time on purpose: PHP should still be what
; stops ordinary runaway work, because it unwinds cleanly and logs a real
; error; FPM only reaps what PHP cannot see. Do NOT lower this below ~300s —
; the LLM is self-hosted on CPU and a legitimate chat reply takes 60-280s. The
; whole chain is sized for that (haproxy.cfg: 300s, php.ini: 300s,
; PythonClient: 280s); this is the last link and must be the longest.
request_terminate_timeout = 310s

; Write a PHP backtrace for any request slow enough to be about to be reaped,
; so the next incident is one `docker compose logs app` away instead of a
; MySQL processlist hunt. Set just under the terminate timeout rather than
; lower, because on this box a 60-280s request is normal for the LLM path and
; anything earlier would log a backtrace for every chat reply.
request_slowlog_timeout = 300s
slowlog = /proc/self/fd/2
