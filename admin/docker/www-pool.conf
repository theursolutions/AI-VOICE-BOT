[www]
; Keep the container environment available to PHP-FPM workers so Laravel's
; env()/getenv() can read the values injected by docker-compose.
clear_env = no

; Surface worker stdout/stderr into the FPM (and therefore container) log.
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
