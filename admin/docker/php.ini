; Production PHP overrides for the admin (Laravel) container.

memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 51M
; 300s, not the usual 30-120, because the LLM is self-hosted on CPU: a single
; chat turn blocks this PHP worker while the local model generates (~0.6 tok/s
; measured, so 60-120s+ per reply). Must stay >= the PythonClient HTTP timeout
; in app/Services/Conversation/PythonClient.php, or PHP kills the request while
; the voice-engine is still generating a perfectly good answer.
; NOTE: with pm.max_children = 20, this means ~20 concurrent chat turns is the
; hard ceiling — each one occupies a worker for its full duration.
max_execution_time = 300

; Populate $_ENV from the environment so Laravel's env() sees container vars
; (default "GPCS" omits E, which would leave $_ENV empty).
variables_order = "EGPCS"

; OPcache — code is immutable inside the image, so don't revalidate on every
; request. A redeploy ships a fresh image, so timestamps don't matter.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
