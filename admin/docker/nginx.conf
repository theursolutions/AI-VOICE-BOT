server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Document uploads (RAG sources) can be large; keep in sync with php.ini.
    client_max_body_size 50m;

    # Log to the container's stdout/stderr so `docker compose logs` works.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # X-Frame-Options is deliberately NOT set here. It is owned by the edge
    # (deploy/production/Caddyfile), which sends DENY for the admin UI but
    # EXCLUDES /widget* — the chat widget has to stay iframe-able on customers'
    # own domains. A blanket SAMEORIGIN at this layer breaks every live embed,
    # and also produced a duplicate, conflicting header alongside Caddy's.
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # ── Webchat widget ─────────────────────────────────────────────────────
    # A second, standalone PHP app. It is served from OUTSIDE the docroot on
    # purpose: widget/app/config/ holds its bootstrap and credentials, and
    # anywhere under public/ those are fetchable over HTTP.
    #
    # `^~` so this wins outright over the `\.php$` regex below — that block
    # resolves SCRIPT_FILENAME from $realpath_root, which is the docroot, and
    # would look for the widget's PHP inside the Laravel app and 404.
    #
    # The trailing slashes on both the location and the alias must match, or
    # nginx concatenates the path wrongly and every asset 404s.
    # `root`, NOT `alias`. The image places the widget at
    # /var/www/wroot/widget/, so the URI path /widget/... appends to this root
    # and resolves correctly with no path rewriting.
    #
    # alias was the obvious choice and is a trap: inside an alias location
    # `try_files $uri` still resolves against the SERVER root, and a nested
    # location does not inherit the alias the way you would expect, so PHP and
    # static files both 404 while the config itself tests valid. root has
    # neither problem, at the cost of one extra directory in the image.
    location ^~ /widget/ {
        root /var/www/wroot;

        # The app's internals are one directory below its entry points, so
        # this has to come first — it is what keeps config and credentials
        # unreadable now that they sit under a root nginx serves from.
        location ~ ^/widget/(app|vendor)/ { deny all; }

        location ~ ^/widget/.+\.php$ {
            root /var/www/wroot;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            # $document_root is this block's root, so this resolves to
            # /var/www/wroot/widget/webchat-app.php.
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        try_files $uri =404;
    }

    # /robots.txt and /sitemap.xml are GENERATED by Laravel
    # (App\Http\Controllers\SeoFilesController) so they always match the SEO
    # settings. No `location` block here on purpose: a static file would be
    # served by try_files above and shadow the route — which is exactly how
    # production served a robots.txt with no Sitemap: line while
    # /sitemap.xml returned 404.

    # ── Static asset caching ────────────────────────────────────────────
    # Nothing was setting Cache-Control, so every CSS/JS/font/image was
    # revalidated on each navigation. Vite output under /build/ is
    # content-hashed and can be cached forever; everything else gets 30 days
    # (the brand icon is already cache-busted with ?v=<mtime>).
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
    }

    # Deny dotfiles (except ACME challenge dirs).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
