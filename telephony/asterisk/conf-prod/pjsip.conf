; =============================================================================
; PJSIP — production
; =============================================================================
; Transports only. Every account is created by the admin panel over ARI
; (client extensions "c<client>_<ext>", website callers "w…") into contexts
; that cannot reach an outside line: internal-calls and web-guest
; (extensions.conf). Trunks, when they come, get their own locked contexts.
; =============================================================================

[global]
type=global
user_agent=serveAI
; No "anonymous": a request that matches no account is rejected.
endpoint_identifier_order=username,auth_username,ip

; Desk phones and apps (MicroSIP, Zoiper) — port 5060, UDP or TCP.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; Browsers: SIP over WebSocket, served by Asterisk's HTTP server (http.conf,
; path /ws) behind Caddy's TLS at wss://<voice domain>/sip-ws.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
