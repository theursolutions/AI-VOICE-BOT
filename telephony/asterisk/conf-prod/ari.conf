; ARI — the voice engine answers calls (Stasis app "ai-crm") and pushes SIP
; accounts. The user and password come from the environment (.env on the
; server: ASTERISK_ARI_USER / ASTERISK_ARI_PASSWORD).
[general]
enabled=yes
pretty=no

[${ASTERISK_ARI_USER}]
type=user
read_only=no
password=${ASTERISK_ARI_PASSWORD}
