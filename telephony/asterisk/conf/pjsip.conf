; =============================================================================
; PJSIP — Phase 0 lab
; =============================================================================
; Two test phones and no trunks. Nothing here can dial a real phone number:
; trunks arrive in Phase 4 with their own locked-down contexts.
;
; __PASS_1001__ / __PASS_1002__ are replaced by install.sh with random
; passwords (kept in /etc/asterisk/lab-credentials.env), so no secret lives
; in git.
; =============================================================================

[global]
type=global
user_agent=serveAI-Asterisk
; No "anonymous" here: a request that doesn't match a known endpoint by IP
; or by username is rejected instead of landing in a guest context.
endpoint_identifier_order=ip,username,auth_username

; ---- Transports -------------------------------------------------------------

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; SIP over WebSocket for browsers. It is served by Asterisk's HTTP server
; (http.conf, path /ws), so "bind" here is ignored.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---- 1001: desktop softphone (MicroSIP / Zoiper) ----------------------------

[1001]
type=endpoint
context=lab-internal
disallow=all
allow=ulaw,alaw
auth=1001
aors=1001
callerid="Softphone" <1001>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001]
type=auth
auth_type=userpass
username=1001
password=__PASS_1001__

[1001]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; ---- 1002: browser phone over WebRTC ----------------------------------------
; webrtc=yes turns on ICE, DTLS-SRTP, AVPF and rtcp-mux. The certificate
; DTLS needs is a separate setting: without it the call connects but no
; audio flows.

[1002]
type=endpoint
context=lab-internal
webrtc=yes
dtls_auto_generate_cert=yes
disallow=all
; G.711 first, like a desk phone: everything else on this system (MicroSIP,
; PBXs, the AI's AudioSocket leg) speaks G.711, so the call passes through
; untouched. Opus first meant Asterisk transcoding every packet.
allow=ulaw,alaw,opus
auth=1002
aors=1002
callerid="Browser" <1002>

[1002]
type=auth
auth_type=userpass
username=1002
password=__PASS_1002__

[1002]
type=aor
max_contacts=5
remove_existing=yes
