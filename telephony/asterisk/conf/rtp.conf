; =============================================================================
; RTP (call audio)
; =============================================================================

[general]
; Every call uses ports from this range — open it (UDP) on any firewall in
; front of Asterisk.
rtpstart=10000
rtpend=20000

; ICE is required for WebRTC (browsers).
icesupport=yes

; WSL puts an extra address on the loopback interface (10.255.255.254) that
; nothing outside WSL can reach. Offered to a browser as an audio path, it
; only produces "Error sending STUN request: Invalid argument".
ice_deny=10.255.255.254/32

; Production behind NAT, or browsers on other networks, also need STUN/TURN:
;stunaddr=stun.l.google.com:19302
