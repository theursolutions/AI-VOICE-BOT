; =============================================================================
; Dialplan — Phase 0 lab
; =============================================================================

[general]
static=yes
writeprotect=yes

; Anything not routed explicitly is rejected (cause 21 = call rejected).
[default]
exten => _X.,1,Hangup(21)

[lab-internal]
; 600 — echo test: you hear your own voice back. Try this first.
exten => 600,1,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

; 1001 / 1002 — ring the other lab phone.
exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; 1122 — the AI agent. The voice engine's ARI client answers it, asks
; Laravel which project owns "1122" (admin → Telephony → number with provider
; Asterisk) and connects the call's audio to the AI over AudioSocket.
; (telephony/tools/ari_smoke.py uses the same app — run one or the other.)
exten => 1122,1,Stasis(ai-crm,inbound,${EXTEN})
 same => n,Hangup()

; Where the AI sends a caller who asks for a person. The voice engine
; continues the call here with the number's "transfer to" as the extension.
; This context is the one place a deployment decides how people are reached:
;   lab            → ring a local phone (below)
;   office PBX     → Transfer(PJSIP/sip:${EXTEN}@<pbx-ip>)  (SIP REFER back
;                    to e.g. a Grandstream UCM, which rings its ext/queue)
;   call centre    → Queue(${EXTEN})
[ai-transfer]
exten => _X.,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
; A client's own extension ("c12_2001"), when its number is the transfer target.
exten => _c.,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Client extensions — SIP accounts created in the admin panel (Telephony →
; Extensions), named c<client>_<extension> and pushed in over ARI. They dial
; each other by the short number; any other number goes to that client's AI
; (the number decides which agent answers). No outside lines from here.
[internal-calls]
exten => 600,1,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

exten => _X.,1,Set(ME=${CHANNEL(endpoint)})
 same => n,Set(TARGET=${CUT(ME,_,1)}_${EXTEN})
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/${TARGET})}" = "INVALID"]?ai)
 same => n,Dial(PJSIP/${TARGET},30)
 same => n,Hangup()
 same => n(ai),Stasis(ai-crm,inbound,${EXTEN},${ME})
 same => n,Hangup()

; Website "Call us" buttons — one-call accounts ("w…") issued by the admin's
; web-call API. They reach the AI and nothing else. The voice engine sets the
; real time limit (60 s on serveai.com.pk); this is only a backstop.
[web-guest]
exten => _X.,1,Set(TIMEOUT(absolute)=600)
 same => n,Stasis(ai-crm,inbound,${EXTEN},${CHANNEL(endpoint)})
 same => n,Hangup()
