; Where PJSIP finds its accounts.
;
; The lab/test extensions (1001, 1002) stay in pjsip.conf. Everything the
; admin panel creates — client extensions, and the one-call guest accounts
; behind a website "Call us" button — is pushed at runtime over ARI
; (PUT /ari/asterisk/config/dynamic/res_pjsip/...) and kept in Asterisk's
; own database (astdb), so it survives restarts and needs no reload.

[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=astdb,ps_endpoints
auth=config,pjsip.conf,criteria=type=auth
auth=astdb,ps_auths
aor=config,pjsip.conf,criteria=type=aor
aor=astdb,ps_aors
