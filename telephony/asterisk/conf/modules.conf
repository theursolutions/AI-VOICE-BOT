; =============================================================================
; Module loading
; =============================================================================

[modules]
autoload=yes

; chan_sip is the old SIP driver: it would fight PJSIP for port 5060.
noload => chan_sip.so

; Channel drivers we don't use.
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so

; Ubuntu ships three builds of voicemail that register the same names and
; flood the log with errors when all load. Keep the plain one.
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so

; The dialplan lives only in extensions.conf — don't load the sample
; AEL/Lua dialplans the package ships with.
noload => pbx_ael.so
noload => pbx_lua.so
; Realtime database drivers we don't use (accounts live in astdb) — loaded,
; they only log connection errors.
noload => res_config_ldap.so
noload => res_config_pgsql.so
