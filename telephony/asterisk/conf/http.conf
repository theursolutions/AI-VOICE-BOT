; =============================================================================
; Asterisk HTTP server — carries ARI (/ari) and SIP over WebSocket (/ws)
; =============================================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; Lab only: serves telephony/asterisk/static/webrtc-lab.html at
; http://localhost:8088/static/webrtc-lab.html. Browsers allow microphone
; access on http://localhost, so the lab needs no certificate.
enablestatic=yes

; Production: browsers off localhost need wss://, i.e. TLS on 8089 with a real
; certificate. Enable when the server and its DNS name exist.
;tlsenable=yes
;tlsbindaddr=0.0.0.0:8089
;tlscertfile=/etc/asterisk/keys/fullchain.pem
;tlsprivatekey=/etc/asterisk/keys/privkey.pem
