# keepalived (VRRP) — floating/virtual IP for true edge HA across TWO hosts.
#
# Run this on BOTH edge nodes (the ones running Caddy+HAProxy). They share one
# Virtual IP; your DNS A record points at the VIP. If the MASTER node dies, the
# BACKUP promotes itself and the VIP moves over in ~1–3s — so the edge itself
# is no longer a single point of failure.
#
# Install on the host (not in a container):  apt-get install -y keepalived
# Edit interface, VIP, and set state MASTER on node-1 / BACKUP on node-2.

vrrp_script chk_edge {
    # Fail over if Caddy stops answering on :443 locally.
    script "/usr/bin/curl -kfsS https://127.0.0.1/ -o /dev/null"
    interval 2
    timeout 3
    fall 2
    rise 2
    weight -40
}

vrrp_instance AICRM_EDGE {
    state MASTER                 # BACKUP on the second node
    interface eth0               # <-- your public NIC
    virtual_router_id 51
    priority 150                 # 150 on MASTER, 100 on BACKUP
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_vrrp   # same on both nodes (<=8 chars for PASS)
    }

    virtual_ipaddress {
        203.0.113.10/32          # <-- your floating public IP (DNS points here)
    }

    track_script {
        chk_edge
    }
}
