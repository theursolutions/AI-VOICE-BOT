# OPTIONAL: add a LOCAL LLM (Ollama) as a SAFETY NET behind cloud Groq.
#
# Wiring: Groq stays the PRIMARY LLM (fast, low RAM). If Groq rate-limits (429),
# errors, or times out, the voice-engine automatically fails over to a local
# Ollama model — so you keep answering even when the cloud provider is flaky or
# you've hit a quota. Best of both worlds on a 24 GB box.
#
# Apply as a THIRD overlay (after the base + prod overlay):
#   docker compose -f docker-compose.yml \
#     -f deploy/production/docker-compose.prod.yml \
#     -f deploy/production/ollama.override.yml up -d
#
# Pull the fallback model once (saved in the ollama_models volume):
#   docker compose -f docker-compose.yml -f deploy/production/docker-compose.prod.yml \
#     -f deploy/production/ollama.override.yml exec ollama ollama pull qwen2.5:3b
#
# ── RAM on this host (48 GB) ────────────────────────────────────────────────
# Baseline (stack + MySQL + XTTS/Whisper) ≈ 10 GB, leaving ~38 GB. Ollama
# lazy-loads on first use and unloads after ~5 min idle, so with Groq primary it
# sits at a few hundred MB and only spikes during a failover.
#   • 3B  (qwen2.5:3b)  ≈ 3 GB   → only if latency matters more than quality
#   • 7B  (qwen2.5:7b)  ≈ 6 GB   → the default; best balance here
#   • 14B (qwen2.5:14b) ≈ 9 GB   → better answers, slower on CPU
#   • 32B               ≈ 20 GB  → fits RAM, but CPU latency is impractical
#   • 70B               ≈ 43 GB  → would leave ~5 GB for everything else. No.
#
# RAM is NOT the binding constraint on this box — CPU throughput is. A larger
# model does not fail, it just answers slower, and a fallback nobody waits for
# is no better than no fallback.
# For full local-LLM speed you still want a GPU; on CPU keep it as the fallback.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # How long the model stays resident after a request. Tune to Ollama's ROLE:
      #
      #   FALLBACK behind Groq (default, 5m) — Ollama is idle almost always, so
      #     holding ~6GB permanently wastes RAM. A cold load costs ~16s, but it
      #     only ever happens on the rare occasion Groq is rate-limited or down.
      #
      #   PRIMARY (LLM_PROVIDER=ollama) — set to "-1" (never unload). Otherwise
      #     every conversation starting after a quiet period pays that ~16s
      #     before its first token, which reads as broken.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      # One model, one request at a time — this box has no GPU and 8 shared
      # vCPUs, so parallel decoding just makes every request slower.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks: [aicrm]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        # Sized for the FALLBACK role: a small model (qwen2.5:3b ≈ 3GB) that runs
        # only while the cloud provider is unavailable. 6 of 8 cores was right
        # when Ollama served every reply, but it starved the app tier — measured
        # 83-87% host CPU on a single conversational question, which risks
        # HAProxy ejecting app replicas mid-request. 3 cores keeps a degraded
        # fallback usable while leaving the rest of the stack responsive.
        # If you ever make Ollama primary again, raise these back to 6 / 10240M.
        # 10GB, not 4GB. The old cap could not hold the model it was configured
        # to run: a 7B needs ~6GB while generating, so the fallback was
        # OOM-killed the moment it was first needed. 4 cores because CPU
        # throughput — not RAM — is what limits generation on this host.
        limits: { cpus: "4", memory: 10240M }

  # Groq primary + Ollama fallback. The voice-engine retries Groq, then fails
  # over to the local model. (fallback must differ from the primary.)
  voice-engine:
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      # 7B on this host: 48GB total, ~10GB baseline, so ~6GB for the model is
      # comfortable and it has the best Urdu/multilingual coverage of the sizes
      # that stay usable on CPU. It only failed before because the container cap
      # above was 4GB — the model was never the problem.
      # 14b (~9GB) also fits if answer quality matters more than latency.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      - ollama

volumes:
  ollama_models:
