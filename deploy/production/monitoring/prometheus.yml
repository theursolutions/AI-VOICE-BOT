# Prometheus scrape + alerting config for the AI Voice CRM stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: ai-crm

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # HAProxy native Prometheus exporter (fe_stats /metrics on :8404).
  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: ["haproxy:8404"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # ── Black-box uptime probes ────────────────────────────────────────────────
  # Internal probes confirm the app tiers are serving (no DNS/TLS needed).
  - job_name: blackbox-internal
    metrics_path: /probe
    params: { module: ["http_2xx"] }
    static_configs:
      - targets:
          - http://app:8080/            # Laravel web (302 -> login counts as up)
          - http://voice-engine:8000/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # External probes verify the full public path incl. TLS + cert expiry.
  # EDIT these two URLs to your real domains, then reload Prometheus.
  - job_name: blackbox-public
    metrics_path: /probe
    params: { module: ["http_2xx"] }
    static_configs:
      - targets:
          - https://crm.example.com/
          - https://voice.example.com/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
