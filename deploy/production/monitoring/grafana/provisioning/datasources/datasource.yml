# Grafana auto-provisioned Prometheus datasource.
# The fixed uid lets the bundled dashboards bind to it without manual wiring.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
