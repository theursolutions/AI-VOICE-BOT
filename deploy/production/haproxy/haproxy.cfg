#==============================================================================
# AI Voice CRM — HAProxy L7 ACL load balancer
#
# Position in the stack:   Caddy (TLS/ACME edge :443)
#                              │  plain HTTP + X-Forwarded-* on the private net
#                              ▼
#                          HAProxy (this) :80   ── ACL routing, health checks,
#                              │                   rate limiting, WS affinity
#                  ┌───────────┴───────────┐
#                  ▼                       ▼
#            app  :8080 (xN)        voice-engine :8000 (xN)
#
# HAProxy never faces the internet directly — only Caddy reaches it — so the
# X-Forwarded-For Caddy sets is trusted for the real client IP.
#
# Backends are discovered dynamically from Docker's embedded DNS (one A record
# per running replica), health-checked individually, and ejected on failure.
#==============================================================================

global
    log stdout format raw local0 info
    maxconn 60000
    # Runtime API: live stats, drain/disable servers, hitless reloads.
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    # Sane modern TLS defaults (used if you later terminate TLS here too).
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor       except 127.0.0.0/8
    option  http-server-close
    # Zero-downtime on failure: if a server dies mid-request, transparently
    # retry the request on another replica so the client never sees the error.
    option  redispatch
    retries 3
    retry-on all-retryable-errors    # conn refused/reset, empty reply, etc.
    # Timeouts — note the long tunnel for voice WebSockets / SSE streams.
    #
    # client/server are 300s because the LLM is SELF-HOSTED on CPU. Measured on
    # this box: qwen2.5:7b generates ~0.6 tok/s, so a normal reply takes 60-120s
    # and a long one more. At the usual 60s these requests were killed mid-flight
    # and surfaced to the widget as an error even though generation succeeded.
    # `timeout client` matters as much as `server`: while HAProxy waits on the
    # backend the client connection looks idle, so a low value aborts it too.
    #
    # If you ever move the LLM to a fast cloud provider, bring these back down
    # to ~60s — a long timeout is a slow-request DoS amplifier, and the only
    # reason to hold connections this long is local inference latency.
    timeout connect         5s
    timeout client          300s
    timeout server          300s
    timeout http-request    15s
    timeout http-keep-alive 4s
    timeout queue           30s
    timeout tunnel          1h
    # Per-server defaults: probe every 2s, eject after 2 fails (~4s to detect a
    # dead replica), restore after 2 successes, ramp back over 30s (slowstart).
    # on-marked-down shutdown-sessions: cut sessions to a downed server at once
    # so in-flight traffic is re-dispatched instead of hanging — key during a
    # rolling deploy when old replicas are stopped.
    default-server inter 2s fall 2 rise 2 slowstart 30s maxconn 2000 observe layer7 error-limit 10 on-error mark-down on-marked-down shutdown-sessions

# Docker's embedded DNS — lets server-template auto-discover replica IPs.
resolvers docker
    nameserver dns1 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    10s
    hold other    10s
    hold refused  10s
    hold nx       10s
    hold timeout  10s
    hold obsolete 10s

#------------------------------------------------------------------------------
# Frontend — all app + voice traffic arrives here from Caddy on :80
#------------------------------------------------------------------------------
frontend fe_main
    bind *:80

    # Capture the real client IP (Caddy is the only, trusted upstream).
    http-request set-var(txn.client_ip) req.hdr_ip(x-forwarded-for,1)

    #--- Abuse protection: per-client-IP rate + concurrency caps --------------
    # Tracks request rate and in-flight connections per real client IP.
    stick-table type ip size 1m expire 30m store http_req_rate(10s),conn_cur,conn_rate(3s)
    http-request track-sc0 var(txn.client_ip)
    acl too_fast       sc_http_req_rate(0) gt 300     # >300 req / 10s
    acl too_many_conn  sc_conn_cur(0)      gt 200     # >200 concurrent
    acl conn_flood     sc_conn_rate(0)     gt 100     # >100 new conn / 3s
    # WebSocket upgrades are long-lived; don't count them as request floods.
    acl is_ws          hdr(Upgrade)        -i websocket
    http-request deny deny_status 429 if too_fast !is_ws
    http-request deny deny_status 429 if conn_flood
    http-request deny deny_status 429 if too_many_conn

    #--- Security response headers (belt-and-suspenders behind Caddy) ---------
    http-response set-header X-Content-Type-Options nosniff
    # NOTE: X-Frame-Options is deliberately NOT set here. It is applied by Caddy,
    # scoped to exclude /widget* — the chat widget must stay iframe-able on
    # customer domains. A blanket SAMEORIGIN at this layer would break it.

    #--- Host-based routing ACLs ----------------------------------------------
    acl host_app   hdr(host) -i -m beg ${APP_DOMAIN}
    acl host_voice hdr(host) -i -m beg ${VOICE_DOMAIN}

    use_backend be_voice if host_voice
    use_backend be_admin if host_app
    default_backend be_admin

#------------------------------------------------------------------------------
# Backend — Laravel admin (stateless: sessions/cache/queue live in Redis)
#------------------------------------------------------------------------------
backend be_admin
    balance roundrobin
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host healthcheck
    http-check expect rstatus ^(2|3)        # 2xx or a redirect (e.g. ->/login)
    # Discover up to 12 `app` replicas; HAProxy health-checks + ejects each.
    server-template app 12 app:8080 check resolvers docker init-addr none

#------------------------------------------------------------------------------
# Backend — voice-engine (stateful per call → sticky by client IP for WS)
#------------------------------------------------------------------------------
backend be_voice
    # A voice call's WebSocket + its follow-up HTTP must hit the same replica.
    # NOTE: `balance source` would hash on the TCP source — which is Caddy for
    # every request — so it can't be used here. Instead distribute round-robin
    # and pin each REAL client (from X-Forwarded-For) to a server via a stick
    # table, so a caller keeps the same voice replica for the whole session.
    balance roundrobin
    stick-table type ip size 100k expire 1h
    stick on var(txn.client_ip)
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    timeout tunnel 1h                        # long-lived voice streams
    server-template ve 8 voice-engine:8000 check resolvers docker init-addr none

#------------------------------------------------------------------------------
# Stats dashboard + Prometheus metrics (scraped by Prometheus, not public)
#------------------------------------------------------------------------------
frontend fe_stats
    bind *:8404
    no log
    # Prometheus exporter (HAProxy native) at /metrics
    http-request use-service prometheus-exporter if { path /metrics }
    # Human dashboard at / (basic auth)
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats show-legends
    stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
