# Redis Sentinel config (run 3 instances for quorum). Sentinel watches the
# primary and promotes a replica automatically on failure.
# See docs/PRODUCTION_HA.md → "Data-tier HA".

port 26379
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor the primary; quorum 2 = at least 2 of 3 sentinels must agree it's down.
sentinel monitor aicrm-redis redis-master 6379 2
sentinel auth-pass aicrm-redis CHANGE_ME_redis_password
sentinel down-after-milliseconds aicrm-redis 5000
sentinel failover-timeout aicrm-redis 15000
sentinel parallel-syncs aicrm-redis 1
