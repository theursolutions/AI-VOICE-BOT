# Redis replica config (advanced data-tier HA — see docs/PRODUCTION_HA.md).
# Replicates from the primary so a Sentinel-driven failover has a warm standby.
# Replace the password to match REDIS_PASSWORD.

port 6379
appendonly yes
replica-read-only yes

# Point at the primary service + authenticate to it and require auth ourselves.
replicaof redis-master 6379
masterauth CHANGE_ME_redis_password
requirepass CHANGE_ME_redis_password

# Failover tuning.
repl-diskless-sync yes
repl-backlog-size 64mb
