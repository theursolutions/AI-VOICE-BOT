; Supervisor program — runs a pool of Laravel queue workers so inbound
; WhatsApp/IG/FB messages and lead extraction process OFF the web request.
; This is what turns QUEUE_CONNECTION=database|redis into real throughput:
; webhooks return instantly, workers chew through jobs in parallel.
;
; Install: copy to /etc/supervisor/conf.d/aicrm-queue.conf, edit the paths,
; then:  supervisorctl reread && supervisorctl update && supervisorctl start aicrm-queue:*
;
; Scale throughput by raising numprocs (each is one concurrent worker).
; Rule of thumb: numprocs ≈ peak jobs/sec × avg-job-seconds, capped by
; your LLM provider's rate limit and DB connections.

[program:aicrm-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/AI-CRM-AGENT/admin/artisan queue:work --queue=default --sleep=1 --tries=3 --backoff=5 --max-time=3600 --max-jobs=500
directory=/var/www/AI-CRM-AGENT/admin
autostart=true
autorestart=true
stopwaitsecs=3600
killasgroup=true
numprocs=4
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/aicrm/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/aicrm/queue_error.log